[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labelwerk"
version = "0.1.0"
description = "Etiketten gestalten und drucken auf Brother-QL-Druckern unter Linux"
readme = "README.md"
# Programm GPL; mitgelieferte Symbole: Tabler Icons MIT, eigene Zeichnungen CC0, Commons gemeinfrei/CC0
license = "GPL-3.0-or-later AND MIT AND CC0-1.0"
license-files = ["LICEN[CS]E*", "src/labelwerk/clipart_data/LICENSES.md"]
requires-python = ">=3.10"
dependencies = [
    "brother_ql-inventree>=1.3,<2",   # printer._Raster nutzt Interna (add_cut_every, page_number)
    "pillow>=10.1",
    "pypdfium2>=4",
    "openpyxl>=3.1",      # Excel-Tabellen für Serien (MIT)
    "defusedxml>=0.7",    # openpyxl liest fremde Dateien damit sicher (PSF)
    "segno>=1.5",         # QR-Codes (BSD-3-Clause)
]

[project.optional-dependencies]
# PySide6 6.12.0 verliert unter Python < 3.12 Referenzen auf None/True/False → Absturz (6.11.2 ok)
gui = ["PySide6>=6.6,!=6.12.0; python_version < '3.12'", "PySide6>=6.6; python_version >= '3.12'"]
# zxing-cpp (Apache-2.0) liest die gedruckten Barcodes in Tests; Wheels erst ab Python 3.12
dev = ["pytest>=8", "pytest-qt>=4", "PySide6>=6.6,!=6.12.0; python_version < '3.12'", "PySide6>=6.6; python_version >= '3.12'",
       "zxing-cpp>=2.2; python_version >= '3.12'"]

[project.scripts]
labelwerk = "labelwerk.cli:main"
labelwerk-gui = "labelwerk.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labelwerk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
