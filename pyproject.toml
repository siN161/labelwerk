[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelwerk"
version = "0.1.0"
description = "Etiketten gestalten und drucken auf Brother-QL-Druckern unter Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "brother_ql-inventree>=1.3",
    "pillow>=10.1",
    "pypdfium2>=4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4", "PySide6>=6.6"]

[project.scripts]
labelwerk = "labelwerk.cli:main"
labelwerk-gui = "labelwerk.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labelwerk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
